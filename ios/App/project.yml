name: App
options:
  bundleIdPrefix: com.tokeiyo929
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  App:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: ShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokeiyo929.photoexport
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 相册分享入口：选图 → 分享 → 「无损导出」。文件经 App Group 收件箱交主 App
  # 登记（Nextcloud 文件摄取模式 + LocalSend 壳配置 + SideStore 重签群组探测）。
  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokeiyo929.photoexport.ShareExtension
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 照片无损导出
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        PEBuild: "${PE_BUILD}"
        # AltStore/SideStore 系重签工具从 Info.plist 读这个键来注册 App Group
        #（classday-ios 同款）；组名与两个 .entitlements 文件保持一致
        ALTAppGroups:
          - group.com.tokeiyo929.photoexport
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 「分享面板直投」通道：相册分享 → App 行点「无损导出」时系统把原文件拷进
        # Documents/Inbox 再拉起 App（不走 App Group，免费签名也能用）。
        CFBundleDocumentTypes:
          - CFBundleTypeName: 照片或视频
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
              - public.movie
        NSPhotoLibraryUsageDescription: 需要读取相册原片字节（HEIC/JPEG/MOV 保持原始格式，不做任何转码），导出到 App 文件目录后传到电脑。
        NSPhotoLibraryAddUsageDescription: 仅在需要保存导出报告时写入相册（当前版本不使用）。
        NSLocalNetworkUsageDescription: 用于在家庭 WiFi 里把已导出的照片直接传到电脑（电脑运行 pull.py --wifi 或浏览器打开显示的地址）。仅限同一局域网，勿在公共 WiFi 开启。

  # 无人值守 CI 授权：iOS 26 模拟器上宿主侧预授权（simctl privacy / TCC.db）对 readWrite 无效，
  # 只有权限弹窗能落授权；用 XCUITest interruption monitor 替人点"允许"。
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: UITests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokeiyo929.photoexport.uitests
        TEST_TARGET_NAME: App
        GENERATE_INFOPLIST_FILE: YES

schemes:
  App:
    build:
      targets:
        App: all
        AppUITests: [test]
    test:
      config: Debug
      targets:
        - AppUITests
