name: Build unsigned iOS ipa

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "tests/**"
      - "pc/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: PC-side unit tests (manifest/verify/zip)
        timeout-minutes: 5
        run: |
          python3 -m unittest discover -s pc -p 'test_*.py' -v

      - name: Generate Xcode project
        working-directory: ios/App
        run: |
          brew install xcodegen
          # 把 CI 构建号打进 Info.plist（PEBuild），App 首页显示「构建 #N」，
          # 用户一眼可验证装的是不是最新版
          export PE_BUILD="${GITHUB_RUN_NUMBER}"
          xcodegen generate

      - name: Build device app (unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log | tail -60; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-device.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/App/build-device.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=ios/App/build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload
          cp -R "$APP" Payload/
          # entitlements 元数据两套并存：
          # ① .xcent（Xcode Archive 同名文件，部分工具会顺带读）：classday 同款，留着无害；
          # ② 真正起作用的伪签名——开源重签栈只从 Mach-O 代码签名读 entitlements：
          #    AltStore/AltSign 的 ldid::Entitlements() 与 SideStore/SideSign 的
          #    MachOParser.entitlements() 都只扫 LC_CODE_SIGNATURE 里的 CSSLOT_ENTITLEMENTS；
          #    未签名二进制两处都是空 → profile 不会带组。
          #    正解（LiveContainer CI 同款思路：ldid -S<entitlements> 写伪签名）——
          #    这里用 runner 自带的 codesign 做等价操作（ad-hoc 签名同样把 entitlements
          #    放进 CSSLOT_ENTITLEMENTS，少一个 brew 依赖）。
          cp ios/App/App/App.entitlements Payload/App.app/archived-expanded-entitlements.xcent
          cp ios/App/ShareExtension/ShareExtension.entitlements Payload/App.app/PlugIns/ShareExtension.appex/archived-expanded-entitlements.xcent
          codesign --force --sign - --timestamp=none \
            --entitlements ios/App/App/App.entitlements Payload/App.app/App
          codesign --force --sign - --timestamp=none \
            --entitlements ios/App/ShareExtension/ShareExtension.entitlements \
            Payload/App.app/PlugIns/ShareExtension.appex/ShareExtension
          # 自检：伪签名里必须真的能读回组名，否则整条链路又静默变空
          codesign -d --entitlements :- Payload/App.app/App 2>/dev/null | grep application-groups
          # SideStore 注册 App ID 时 appIdName 不吃非 ASCII（classday 同款踩坑）：
          # 打包态给 ASCII 显示名，中文名走 zh-Hans 本地化，设备上仍显示中文
          python3 - <<'PYEOF'
          import plistlib, os
          app = "Payload/App.app"
          pairs = [("", "PhotoExport", "照片无损导出"),
                   ("PlugIns/ShareExtension.appex", "PhotoExport Share", "无损导出")]
          for sub, ascii_name, zh_name in pairs:
              info = os.path.join(app, sub, "Info.plist")
              d = plistlib.load(open(info, "rb"))
              d["CFBundleDisplayName"] = ascii_name
              plistlib.dump(d, open(info, "wb"), fmt=plistlib.FMT_BINARY)
              loc = os.path.join(app, sub, "zh-Hans.lproj")
              os.makedirs(loc, exist_ok=True)
              with open(os.path.join(loc, "InfoPlist.strings"), "w", encoding="utf-8") as f:
                  f.write('"CFBundleDisplayName" = "%s";\n"CFBundleName" = "%s";\n' % (zh_name, zh_name))
          print("patched display names for SideStore")
          PYEOF
          zip -qry photo-export-unsigned.ipa Payload
          rm -rf Payload
          ls -lh photo-export-unsigned.ipa

      - name: Resolve simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $UDID"

      - name: Build simulator app
        working-directory: ios/App
        run: |
          set -o pipefail
          if xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build 2>&1 | tee build-sim.log | tail -40; then
            echo "BUILD_OK"
          else
            grep -E "error:" build-sim.log | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Core regression compile (isolated)
        timeout-minutes: 5
        run: |
          set -o pipefail
          swiftc -DDEBUG ios/App/App/ExportPlanner.swift ios/App/App/FileHasher.swift ios/App/App/ManifestStore.swift ios/App/App/TestSupport.swift tests/CoreTests.swift -o /tmp/pe-core-tests 2>&1 | tee core-compile.log

      - name: Core regression run (isolated)
        timeout-minutes: 5
        run: |
          set -o pipefail
          /tmp/pe-core-tests 2>&1 | tee core-run.log

      - name: Runner script gate (isolated)
        timeout-minutes: 5
        run: bash tests/test_simulator_runner.sh

      - name: Grant photo library via XCUITest (无人值守授权)
        timeout-minutes: 20
        working-directory: ios/App
        run: |
          set -o pipefail
          # iOS 26 runtime 上宿主侧预授权（simctl privacy / TCC.db）对 readWrite 无效，
          # 只有用 XCUITest interruption monitor 点掉权限弹窗才能落授权；
          # 授权按 bundle id 存在模拟器里，后续 -autoSmoke 直接以已授权状态启动。
          xcodebuild test -project App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build 2>&1 | tee grant-test.log | tail -40

      - name: Launch on simulator and smoke-tour
        timeout-minutes: 15
        run: |
          set -euo pipefail
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          python3 tests/make_fixtures.py
          xcrun simctl addmedia "$UDID" tests/fixtures/pe-fixture-red-64.png tests/fixtures/pe-fixture-blue-48.png
          # 相册权限已由上一步的 XCUITest 弹窗授权落库
          bash tests/run_simulator_tests.sh "$UDID" smoke > smoke-debug.txt 2>&1

      - name: Run in-app self tests (-autoTest, isolated)
        timeout-minutes: 15
        run: bash tests/run_simulator_tests.sh "${{ steps.sim.outputs.udid }}" autotest > auto-test.txt 2>&1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: photo-export-unsigned-ipa
          path: photo-export-unsigned.ipa
          if-no-files-found: error

      - name: Collect simulator crash reports
        if: always()
        run: |
          mkdir -p crashlogs
          cp "$HOME"/Library/Logs/DiagnosticReports/*photoexport* crashlogs/ 2>/dev/null || true
          cp "$HOME"/Library/Logs/DiagnosticReports/App-* crashlogs/ 2>/dev/null || true

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            smoke/
            autotest/
            smoke-debug.txt
            auto-test.txt
            ios/App/grant-test.log
            core-compile.log
            core-run.log
            *-console.txt
            ios/App/build-sim.log
            crashlogs/
          if-no-files-found: ignore

      - name: Publish IPA to release
        run: |
          gh release create "ipa-${{ github.run_number }}" photo-export-unsigned.ipa smoke-debug.txt auto-test.txt smoke/*.png \
            --title "照片无损导出 未签名 IPA (build ${{ github.run_number }})" \
            --notes "Sideloadly 直接装这个 ipa。模拟器巡访截图见 smoke-screenshots artifact。" \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
